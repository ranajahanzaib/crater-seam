name: Coordinate audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web test
      - run: pnpm --dir web build
      - run: cargo run --locked -- fetch --source robbins --revision a6d08bfde1273a5e92fa34dbd584eafb6d667e8b
      - run: cargo run --locked -- check --input data/lunar_craters.parquet --profile profiles/robbins.json --baseline tests/baselines/robbins.json
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Browser and real-data integration
        run: |
          cargo run --locked -- serve --input data/lunar_craters.parquet > /tmp/craterseam.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8787/api/health; then break; fi
            sleep 1
          done
          pnpm --dir web test:e2e
          node tests/integration/verify-real.mjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: web/test-results
